<html lang="en"><head>
<meta charset="utf-8">

</head><body>
<title>Garage Strength</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Archivo:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column, fixed bottom tab bar; garage graphite with competition-kettlebell colours as the only accents */
:root{
  --bg:#F2F1EC; --surface:#FFFFFF; --surface2:#E9E7E0; --line:#D8D5CC;
  --fg:#1B1C1F; --muted:#64625C; --accent:#F2C230; --accent-ink:#1E1904; --accent-text:#8A6500;
  --good:#2E8A4C; --warn:#B26A00; --bad:#C2443A;
  --kb10:#E06A8D; --kb16:#F2C230; --kb24:#3E9A55;
  --shadow:0 1px 2px rgba(20,20,20,.06);
  --font-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --font-body:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151619; --surface:#1F2024; --surface2:#2A2B30; --line:#35363C;
  --fg:#ECEBE6; --muted:#9E9C95; --accent:#F2C230; --accent-ink:#1E1904; --accent-text:#F2C230;
  --good:#62C27E; --warn:#E8A33D; --bad:#EB6E62; --shadow:none; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#151619; --surface:#1F2024; --surface2:#2A2B30; --line:#35363C;
  --fg:#ECEBE6; --muted:#9E9C95; --accent:#F2C230; --accent-ink:#1E1904; --accent-text:#F2C230;
  --good:#62C27E; --warn:#E8A33D; --bad:#EB6E62; --shadow:none; color-scheme:dark;}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 96px}
.wrap{max-width:640px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.05}
h1{font-size:34px;text-transform:uppercase}
h2{font-size:24px;text-transform:uppercase}
h3{font-size:19px;text-transform:uppercase}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

header.top{padding-block:20px 12px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
header.top .sub{font-size:13px;color:var(--muted);margin-top:4px}
.weekbadge{font-family:var(--font-display);font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.04em;background:var(--accent);color:var(--accent-ink);padding:4px 10px;border-radius:4px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;box-shadow:var(--shadow)}
.notice{border-left:4px solid var(--warn);background:var(--surface);border-radius:6px;padding:10px 12px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.notice.good{border-left-color:var(--good)}
.notice.bad{border-left-color:var(--bad)}
.notice b{display:block;margin-bottom:2px}

.seg{display:flex;background:var(--surface2);border-radius:8px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:6px;font-weight:600;font-size:14px;color:var(--muted);position:relative}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg .next{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-text);font-weight:700}

.ex{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-name{border:0;background:none;padding:0;text-align:left;font-weight:700;font-size:17px;color:var(--fg);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px;text-decoration-thickness:2px}
.ex-name:hover{text-decoration-color:var(--accent)}
.how{flex:none;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}
.target{font-size:14px}
.target b{font-variant-numeric:tabular-nums}
.sug{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none;border:1px solid rgba(0,0,0,.15)}
.last{font-size:13px;color:var(--muted)}
.inputs{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center}
.inputs .lab{font-size:12px;color:var(--muted);font-weight:600}
.sets{display:flex;gap:6px;flex-wrap:wrap}
input[type=number],input[type=text],input[type=date],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;min-width:0}
.sets input{width:52px;text-align:center;font-variant-numeric:tabular-nums}
.wt{width:90px}
.feel{display:flex;gap:6px;flex-wrap:wrap}
.feel button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.feel button[aria-pressed="true"][data-f="easy"]{background:var(--good);border-color:var(--good);color:#fff}
.feel button[aria-pressed="true"][data-f="right"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.feel button[aria-pressed="true"][data-f="hard"]{background:var(--bad);border-color:var(--bad);color:#fff}
.note{width:100%}
.exnote{font-size:13px;color:var(--muted);font-style:italic}
.fin{border-style:dashed}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--fg)}
.chip.up{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.chip.down{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.chip.deload{background:var(--accent);color:var(--accent-ink)}

.btn{border:0;border-radius:8px;padding:12px 16px;font-weight:700;background:var(--surface2);color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-family:var(--font-display);font-size:20px;text-transform:uppercase;letter-spacing:.04em;width:100%}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}

details.warm summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between}
details.warm summary::-webkit-details-marker{display:none}
details.warm ol{margin:10px 0 0;padding-left:20px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:20}
nav.tabs .in{display:flex;max-width:640px;width:100%}
nav.tabs button{flex:1;min-width:0;border:0;background:none;padding:8px 2px;font-family:var(--font-display);font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-top:3px solid transparent}
nav.tabs button[aria-current="page"]{color:var(--fg);border-top-color:var(--accent)}

.phase{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.phase>summary{padding:12px 14px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:center}
.phase>summary::-webkit-details-marker{display:none}
.phase .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:14px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td,.tbl th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.tbl td:last-child,.tbl th:last-child{text-align:right;white-space:nowrap}
.linkish{border:0;background:none;padding:0;color:var(--fg);font-weight:600;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.stat .v{font-family:var(--font-display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .plan{stroke:var(--muted);stroke-dasharray:4 4;fill:none;stroke-width:1.5}
.chart .line{stroke:var(--fg);fill:none;stroke-width:2}
.chart .pt{fill:var(--surface);stroke:var(--fg);stroke-width:2}
.chart .last{fill:var(--accent);stroke:var(--fg);stroke-width:2}
.list{display:flex;flex-direction:column}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}

.sheet-back{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:14px 14px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.sheet-back{align-items:center}.sheet{border-radius:14px}}
.sheet ol,.sheet ul{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.sheet .grip{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:60;max-width:90vw}
textarea{width:100%;min-height:90px;font-family:ui-monospace,monospace;font-size:12px}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}

.daynav{display:flex;align-items:center;gap:8px;justify-content:space-between}
.daynav .btn{font-size:20px;line-height:1;padding:6px 14px}
.dn-mid{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.kgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.big{font-family:var(--font-display);font-weight:800;font-size:30px;line-height:1.05}
.bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent)}
.bar.over span{background:var(--bad)}
.bar.prot span{background:var(--good)}
.results{display:flex;flex-direction:column;gap:4px}
.res{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px;text-align:left;width:100%;color:var(--fg)}
.list .res{border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:9px 0}
.selbox{border:2px solid var(--accent);border-radius:8px;padding:10px}
textarea.prose{font-family:var(--font-body);font-size:15px}
.diary{min-height:45vh;line-height:1.6;padding:12px}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days button{flex:1 1 40px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 0;font-weight:600;font-size:13px}
.days button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.week{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.wday{border-top:1px solid var(--line);padding-top:6px}
.wday.is-today .wd-h b{color:var(--accent-text)}
.wi{display:flex;gap:8px;align-items:center;padding:3px 0}
.it{display:flex;gap:8px;align-items:center}
.nextup b{color:var(--accent-text)}
.cat-train{background:color-mix(in srgb,var(--accent) 35%,transparent)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp figure{margin:0;display:flex;flex-direction:column;gap:4px;min-width:0}
.phbtn{padding:0;border:0;background:none;position:relative;display:block;width:100%}
.cmp img,.thumbs img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;background:var(--surface2);display:block}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:6px}
.thumbs .tag{position:absolute;left:4px;bottom:4px;font-size:11px;font-weight:700;background:rgba(0,0,0,.6);color:#fff;padding:1px 6px;border-radius:4px}
.sheet img.full{width:100%;border-radius:8px;display:block}
details.addact>summary{list-style:none}
details.addact>summary::-webkit-details-marker{display:none}
#remind{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;display:flex;flex-direction:column;gap:6px;padding:8px 16px;pointer-events:none}
#remind:empty{display:none}
.rem{pointer-events:auto;max-width:640px;margin:0 auto;width:100%;display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.rem .btn{background:var(--accent);color:var(--accent-ink)}
.rem .btn.ghost{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 45%,transparent)}
</style>

<div class="wrap" id="app"></div>
<nav class="tabs" aria-label="Sections"><div class="in">
  <button data-tab="today">Today</button>
  <button data-tab="train">Train</button>
  <button data-tab="food">Food</button>
  <button data-tab="diary">Diary</button>

  <button data-tab="more">More</button>
</div></nav>
<div id="remind" aria-live="polite"></div>

<script>

/* ============ EXERCISE LIBRARY ============ */
const BELLS=[10,16,24];
const BELLCOL={10:'var(--kb10)',16:'var(--kb16)',24:'var(--kb24)'};
const BAND=['Band, foot in loop','Band, knee in loop','Bodyweight','+4 kg','+8 kg','+12 kg','+16 kg'];
const LOWER_BB=['deadlift_bb','rdl_bb','hip_thrust'];

const EX={
goblet_squat:{n:'Goblet squat',load:'kb',start:16,eq:'Kettlebell',mus:'Quads, glutes, core',
 steps:['Hold the bell by the horns at chest height, elbows pointing down.','Feet a bit wider than hips, toes turned out 15–30°.','Sit down between your heels, keep the chest tall, until hips are below knees.','Drive up through the whole foot and squeeze glutes at the top.'],
 cues:['Elbows brush the inside of the knees at the bottom','Knees track over the toes','Breathe in before you go down, out on the way up'],
 bad:['Heels lifting','Rounding the back at the bottom','Knees caving in'],easy:'Squat to a bench behind you',hard:'Heavier dumbbell, or 3 s pause at the bottom'},
pause_goblet:{n:'Paused goblet squat',load:'db',start:20,eq:'Dumbbell (held vertically)',mus:'Quads, glutes, core',
 steps:['Hold one dumbbell vertically against your chest, cupping the top plate.','Squat down as for the goblet squat.','Hold still at the bottom for 3 full seconds, staying tight.','Drive up hard.'],
 cues:['Stay braced during the pause, do not relax into the bottom','Count the pause honestly'],bad:['Bouncing out of the bottom','Letting the dumbbell drift away from the chest'],easy:'Shorter pause (1 s)',hard:'Heavier dumbbell'},
db_bench:{n:'Dumbbell bench press',load:'db',start:16,eq:'Dumbbells, flat bench',mus:'Chest, front shoulders, triceps',
 steps:['Sit on the bench with the dumbbells on your thighs, then lie back and kick them up.','Shoulder blades pulled back and down, feet flat, slight arch.','Lower the dumbbells to the sides of the chest, elbows about 45° from the body.','Press up and slightly together until arms are straight.'],
 cues:['Forearms vertical at the bottom','Control the lowering, 2 seconds','Squeeze the chest at the top'],bad:['Elbows flared straight out (shoulder stress)','Bouncing at the bottom','Feet off the floor'],easy:'Push-ups on the bench edge',hard:'Heavier, or 3 s lowering'},
incline_press:{n:'Incline dumbbell press',load:'db',start:16,eq:'Dumbbells, bench at ~30°',mus:'Upper chest, shoulders, triceps',
 steps:['Set the bench to about 30° (one or two notches up).','Kick the dumbbells up as for the flat press.','Lower to the upper chest, elbows slightly tucked.','Press up over the shoulders.'],
 cues:['Keep the angle low, steep turns it into a shoulder press','Shoulder blades pinned to the bench'],bad:['Bench too upright','Arching off the bench to finish reps'],easy:'Lighter dumbbells',hard:'Slow 3 s lowering'},
db_row:{n:'One-arm dumbbell row',load:'db',start:16,eq:'Dumbbell, bench',mus:'Lats, mid-back, biceps',side:1,
 steps:['Put one knee and the same-side hand on the bench, back flat like a table.','Hold the dumbbell with the other arm hanging straight down.','Pull the dumbbell toward your hip, elbow close to the body.','Lower under control until the arm is straight.'],
 cues:['Think "elbow to back pocket"','Keep the shoulders square to the floor','Pause one second at the top'],bad:['Twisting the torso to heave the weight','Shrugging toward the ear'],easy:'Lighter, two-hand support',hard:'Heavier, 2 s pause at top'},
chest_row:{n:'Chest-supported dumbbell row',load:'db',start:18,eq:'Dumbbells, incline bench',mus:'Upper and mid-back, rear shoulders',
 steps:['Set the bench to incline and lie face-down on it, chest on the pad.','Let the dumbbells hang straight down.','Row both up, squeezing shoulder blades together.','Lower slowly to a full stretch.'],
 cues:['Chest stays on the pad the whole time','Lead with the elbows'],bad:['Lifting the chest off the pad to cheat','Short half reps'],easy:'Lighter dumbbells',hard:'2 s squeeze at the top'},
kb_deadlift:{n:'Kettlebell deadlift',load:'kb',start:24,eq:'Kettlebell',mus:'Glutes, hamstrings, back',
 steps:['Stand with the bell between your feet, in line with the ankles.','Push hips back, soft knees, flat back, and grab the handle.','Pull the slack out of the arms, chest up.','Stand up by driving hips forward; lower the same way.'],
 cues:['It is a hip hinge, not a squat','Neck in line with the spine','Squeeze glutes to finish'],bad:['Rounding the lower back','Leaning back at the top'],easy:'Lighter bell',hard:'3 s lowering, or move to the barbell'},
rdl_bb:{n:'Barbell Romanian deadlift',load:'bb',start:30,eq:'Barbell + plates',mus:'Hamstrings, glutes, lower back',
 steps:['Stand tall holding the bar at the hips, hands just outside the thighs.','Soften the knees slightly and keep them there.','Push the hips back and slide the bar down the thighs until you feel a strong hamstring stretch (around mid-shin).','Drive hips forward to stand up.'],
 cues:['Bar stays in contact with the legs','Back flat, chest proud','The movement is hips back, not bending over'],bad:['Rounding the back to reach lower','Bending the knees into a squat'],easy:'Lighter, shorter range',hard:'Heavier, 3 s lowering'},
deadlift_bb:{n:'Barbell deadlift',load:'bb',start:40,eq:'Barbell + plates',mus:'Whole posterior chain, grip',
 steps:['Bar over mid-foot, feet hip-width. Bend down and grip just outside the legs.','Shins touch the bar, hips higher than knees, back flat, chest up.','Big breath into the belly and brace, pull the slack out of the bar.','Push the floor away and stand up tall; lower by pushing hips back first.'],
 cues:['Bar travels in a straight line against the legs','Brace before every rep','Reset between reps, no bouncing'],bad:['Rounded lower back','Hips shooting up first','Jerking the bar off the floor'],easy:'Kettlebell deadlift',hard:'Add 2.5–5 kg'},
hip_thrust:{n:'Barbell hip thrust',load:'bb',start:40,eq:'Barbell, bench (pad the bar with a towel)',mus:'Glutes, hamstrings',
 steps:['Sit on the floor with your upper back against the long side of the bench.','Roll the barbell over your hips; a folded towel under it helps.','Feet flat, knees bent about 90° at the top.','Drive hips up until the body is flat from shoulders to knees, squeeze, lower.'],
 cues:['Chin tucked, look forward not up','Ribs down, do not arch the lower back','Pause 1 s at the top'],bad:['Hyperextending the back','Pushing through the toes'],easy:'Bodyweight or dumbbell on the hips',hard:'Heavier, 2 s pause'},
pullup:{n:'Pull-up',load:'band',start:0,eq:'Wall pull-up bar, band',mus:'Lats, upper back, biceps',
 steps:['Grip the bar slightly wider than shoulders, palms facing away.','Hang with straight arms, shoulders pulled slightly down.','Pull until the chin is over the bar, elbows driving down to the ribs.','Lower all the way to straight arms under control.'],
 cues:['Band: loop it over the bar and put a foot (most help) or knee in it','Start each rep by pulling the shoulders down','No kipping or swinging'],bad:['Half reps','Shrugging','Dropping fast'],easy:'5 s negatives: jump up, lower slowly',hard:'Dumbbell held between the feet'},
chinup:{n:'Chin-up',load:'band',start:0,eq:'Wall pull-up bar, band',mus:'Lats, biceps',
 steps:['Grip shoulder-width, palms facing you.','Hang with straight arms.','Pull the chest toward the bar, chin over it.','Lower slowly to a full hang.'],

function dayBurn(d){
 const kg=kgOn(d);const base=Math.round(bmr(d)*1.15);
 const steps=+(D.steps[d]||0);const st=Math.round(steps*0.0005*kg);
 const tr=Math.round(D.sessions.filter(s=>s.d===d).reduce((a,s)=>a+(s.min||50)/60*5*kg,0));
 const ac=Math.round(D.acts.filter(a=>a.d===d).reduce((a,x)=>a+x.kcal,0));
 return{base,steps,st,tr,ac,total:base+st+tr+ac};
}
function deficitFor(d){return d<'2027-01-01'?300:d<'2027-06-07'?500:0}
function dayEat(d){const F=D.food.filter(f=>f.d===d);return{kcal:Math.round(F.reduce((a,f)=>a+f.kcal,0)),prot:Math.round(F.reduce((a,f)=>a+(f.prot||0),0)),items:F}}
function targetFor(d){const b=dayBurn(d);return Math.max(Math.round(bmr(d)),b.total-deficitFor(d))}

/* ============ PROGRESSION ============ */
const PAIN=/(pain|hurt|sore joint|vondt|smerte|stikk|ache|klikk|click)/i;
const EASYW=/(too easy|for lett|lett|easy)/i, HARDW=/(too hard|for tungt|tungt|heavy|hard)/i;
function feelOf(log){if(log.feel)return log.feel;if(log.note){if(EASYW.test(log.note))return'easy';if(HARDW.test(log.note))return'hard'}return null}
function logsFor(ex){const out=[];for(const s of D.sessions)for(const it of s.items)if(it.ex===ex)out.push({...it,d:s.d,deload:s.deload});return out.sort((a,b)=>a.d<b.d?-1:1)}
function up(load,ex,w){
 if(load==='db')return w>=40?{w:40,max:true}:{w:Math.min(40,w+2)};
 if(load==='bb')return{w:w+(LOWER_BB.includes(ex)?5:2.5)};
 if(load==='att')return{w:w+2.5};
 if(load==='kb'){const i=BELLS.indexOf(w);return i<0||i===BELLS.length-1?{w:24,max:true}:{w:BELLS[i+1]}}
 return{w};
}
function down(load,ex,w){
 if(load==='db')return Math.max(5,w-2);
 if(load==='bb')return Math.max(0,w-(LOWER_BB.includes(ex)?5:2.5));
 if(load==='att')return Math.max(0,w-2.5);
 if(load==='kb'){const i=BELLS.indexOf(w);return i>0?BELLS[i-1]:BELLS[0]}
 return w;
}
/* Replays every logged set for an exercise and returns next suggestion + reason. */
function suggest(ex){
 const L=EX[ex].load;let w=EX[ex].start??0,lvl=EX[ex].start??0;let hardStreak=0,easyStreak=0;let reason='Starting point. Pick a weight where the bottom of the rep range leaves about 2 reps in the tank.';let dir=0;let pain=false;let best=null;
 const logs=logsFor(ex);
 for(const g of logs){
  const f=feelOf(g);const reps=(g.reps||[]).map(Number).filter(n=>n>0);
  pain=!!(g.note&&PAIN.test(g.note));
  if(reps.length)best=Math.max(best??0,...reps);
  if(g.deload){reason='Deload week logged, no change.';dir=0;continue}
  const base=L==='band'?(g.lvl??lvl):(g.w!=null&&g.w!==''?Number(g.w):w);
  if(L==='band')lvl=base;else w=base;
  hardStreak=f==='hard'?hardStreak+1:0;easyStreak=f==='easy'?easyStreak+1:0;
  const lo=g.lo,hi=g.hi;
  let allTop=false,anyBelow=false,near=false;
  if(g.kind==='dist'){allTop=f!=='hard'&&g.done;anyBelow=f==='hard'&&hardStreak>=2}
  else if(lo!=null&&reps.length){allTop=reps.length>=Math.min(g.sets||1,reps.length)&&reps.every(r=>r>=hi)&&reps.length>=(g.sets||1);anyBelow=reps.some(r=>r<lo);near=reps.reduce((a,b)=>a+b,0)/reps.length>=hi-1}
  if(pain){reason='You noted pain last time. Same or lighter load, and try the easier option if it comes back.';dir=0;if(L!=='band'&&L!=='bw'&&L!=='none')w=down(L,ex,w);continue}
  if(L==='bw'||L==='none'){reason=f==='easy'?'Felt easy: add reps or seconds, or try the harder option.':f==='hard'?'Felt hard: repeat the same target.':'Beat last time by a rep or a few seconds.';dir=0;continue}
  if(L==='band'){
   if((allTop&&f!=='hard')||(easyStreak>=2&&near)){lvl=Math.min(BAND.length-1,lvl+1);reason='Hit the top of the range: one step harder.';dir=1}
   else if(anyBelow||hardStreak>=2){lvl=Math.max(0,lvl-1);reason='Missed the range or felt hard twice: one step easier.';dir=-1;hardStreak=0}
   else{reason='Same setting, add a rep where you can.';dir=0}
   continue}
  if(anyBelow||hardStreak>=2){const nw=down(L,ex,w);reason=anyBelow?'Missed the bottom of the rep range: a bit lighter.':'Felt hard two sessions running: a bit lighter.';dir=nw<w?-1:0;w=nw;hardStreak=0;continue}
  if((allTop&&f!=='hard')||(f==='easy'&&near)||(easyStreak>=2)){const r=up(L,ex,w);if(r.max){reason=L==='kb'?'Top bell already: add reps, slow the lowering, or switch to a dumbbell.':'Heaviest dumbbell already: slow the lowering to 3 s or add a pause.';dir=0}else{reason=`Top of the range${f==='easy'?' and felt easy':''}: go up.`;dir=1;w=r.w;easyStreak=0}continue}
  reason=f==='hard'?'Felt hard: same weight, aim to match your reps.':'Same weight, beat your reps.';dir=0;
 }
 return{w,lvl,reason,dir,pain,logs,best};
}
function weightLabel(ex,s,deload){
 const L=EX[ex].load;
 if(L==='band')return BAND[s.lvl];
 if(L==='bw'||L==='none')return'Bodyweight';
 let w=s.w;if(deload&&(L==='db'||L==='bb'||L==='att'))w=L==='db'?Math.max(5,Math.round(w*0.9)):Math.round(w*0.9/2.5)*2.5;
 return w+' kg';
}

/* ============ WEIGHT TREND ============ */
function trend(){
 const W=[...D.weigh].sort((a,b)=>a.d<b.d?-1:1);if(W.length<2)return null;
 const last=parse(W[W.length-1].d);const recent=W.filter(x=>(last-parse(x.d))/DAY<=28);
 if(recent.length<2)return null;const span=(last-parse(recent[0].d))/DAY;if(span<10)return null;
 const xs=recent.map(x=>(parse(x.d)-parse(recent[0].d))/DAY),ys=recent.map(x=>x.kg);
 const mx=xs.reduce((a,b)=>a+b)/xs.length,my=ys.reduce((a,b)=>a+b)/ys.length;
 let num=0,den=0;xs.forEach((x,i)=>{num+=(x-mx)*(ys[i]-my);den+=(x-mx)**2});
 return den?num/den*7:null;
}
function cutPhase(dstr){return dstr>='2027-01-01'&&dstr<'2027-06-07'}
function weightAdvice(){
 const r=trend();const t=today();const cut=cutPhase(t);
 if(r==null)return{finMod:0,msg:null,rate:null};
 const rs=(r>0?'+':'')+r.toFixed(2)+' kg/week';
 if(r<-1)return{finMod:-1,rate:r,kind:'bad',title:'Losing weight fast ('+rs+')',msg:'Faster than about 1 kg a week costs strength. Add a protein snack or a bit more at dinner. Finishers are trimmed until it slows.'};
 if(cut&&r>-0.2)return{finMod:1,rate:r,kind:'warn',title:'Weight has stalled ('+rs+')',msg:'Trim evening portions and extras. Finishers get 2 extra rounds, and a fourth bag session helps if you have time.'};
 if(!cut&&r>0.3)return{finMod:1,rate:r,kind:'warn',title:'Weight is creeping up ('+rs+')',msg:'Check the evening snacking. Finishers get 2 extra rounds for now.'};
 return{finMod:0,rate:r,kind:'good',title:'On track ('+rs+')',msg:cut?'Aim for about 0.5 kg a week down. Keep going.':'Oct–Dec target: steady or slowly down while strength climbs.'};
}
function finText(f,mod){
 if(mod>0)return f.text+' <span class="chip up">+2 rounds or +3 min this week</span>';
 if(mod<0)return f.text+' <span class="chip down">Do about two-thirds this week</span>';
 return f.text;
}
function fatigue(){
 const recent=D.sessions.slice(-3).flatMap(s=>s.items).map(feelOf).filter(Boolean);
 if(recent.length<6)return false;return recent.filter(f=>f==='hard').length/recent.length>=0.5;
}

function current(){
 const t=today();const week=weekOf(t);const ph=phaseOf(week);const deload=DELOAD.includes(week)||D.forceDeload;
 const inPhase=D.sessions.filter(s=>s.phase===ph.id);const lastName=inPhase.length?inPhase[inPhase.length-1].workout:null;
 const idx=lastName?(ph.w.findIndex(w=>w.name===lastName)+1)%ph.w.length:0;
 return{t,week,ph,deload,nextIdx:idx,before:t<D.start};
}
function setsFor(item,cur){let s=item.sets;if(cur.ph.id==='p1'&&cur.week<=2&&item.kind!=='emom')s=Math.min(s,2);if(cur.deload&&item.kind!=='emom')s=Math.ceil(s/2);return s}
function targetText(item,sets){
 const side=EX[item.ex].side?' per side':'';
 if(item.kind==='max')return`${sets} × max reps`;
 if(item.kind==='emom')return`10 rounds × ${item.lo} reps`;
 if(item.kind==='time')return`${sets} × ${item.lo===item.hi?item.lo:item.lo+'–'+item.hi} s${side}`;
 if(item.kind==='dist')return`${sets} × ${item.lo} m${side}`;
 return`${sets} × ${item.lo===item.hi?item.lo:item.lo+'–'+item.hi}${side}`;
}
function occursOn(it,d){if(it.date)return it.date===d;return(it.days||[]).includes(parse(d).getDay())}
function schedFor(d){return D.sched.filter(it=>occursOn(it,d)).sort((a,b)=>a.time<b.time?-1:1)}

 const adv=weightAdvice();

function exCard(it,i,c,dr){
 const e=EX[it.ex];const s=suggest(it.ex);const sets=setsFor(it,c);const d=dr[i]||{};const L=e.load;
 const last=s.logs[s.logs.length-1];
 let sugHTML='';
 if(L==='kb'){const w=s.w;sugHTML=`<span class="sug"><span class="dot" style="background:${BELLCOL[w]||'var(--muted)'}"></span>${w} kg bell</span>`}
 else if(L!=='bw'&&L!=='none')sugHTML=`<span class="sug">${esc(weightLabel(it.ex,s,c.deload))}</span>`;
 const arrow=s.dir>0?'<span class="chip up">↑ up</span>':s.dir<0?'<span class="chip down">↓ lighter</span>':'';
 let lastHTML='';if(last){const lw=L==='band'?BAND[last.lvl??0]:(L==='bw'||L==='none')?'':(last.w+' kg');lastHTML=`<div class="last">Last (${fmt(last.d)}): ${esc(lw)}${last.reps&&last.reps.length?' · '+last.reps.join('/'):''}${feelOf(last)?' · '+({easy:'too easy',right:'just right',hard:'too hard'}[feelOf(last)]):''}${last.note?' · “'+esc(last.note)+'”':''}</div>`}
 let wInput='';
 if(L==='kb'){const v=d.w??s.w;wInput=`<span class="lab">Bell</span><select id="w-${i}" data-k="${i}" data-f2="w">${BELLS.map(b=>`<option value="${b}" ${+v===b?'selected':''}>${b} kg</option>`).join('')}</select>`}
 else if(L==='band'){const v=d.lvl??s.lvl;wInput=`<span class="lab">Setting</span><select id="w-${i}" data-k="${i}" data-f2="lvl">${BAND.map((b,j)=>`<option value="${j}" ${+v===j?'selected':''}>${b}</option>`).join('')}</select>`}

 async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('p',mode);const q=fn(t.objectStore('p'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
 all(){return this.tx('readonly',st=>st.getAll())},put(o){return this.tx('readwrite',st=>st.put(o))},del(id){return this.tx('readwrite',st=>st.delete(id))}};

  out+=`<div class="card">${chart(W)}<div class="row small muted" style="margin-top:6px"><span>— your weight</span><span>- - plan: steady to Jan, then −0.5 kg/week to ~80 kg</span></div></div>`;
  if(adv.msg)out+=`<div class="notice ${adv.kind==='bad'?'bad':adv.kind==='good'?'good':''}"><b>${adv.title}</b>${adv.msg}</div>`;
  else out+=`<div class="notice"><b>Trend needs a few weeks</b>After 2–3 weekly weigh-ins the app starts adjusting your finishers.</div>`;
  out+=`<div class="card"><div class="label">Entries</div><div class="list">${W.slice().reverse().map(x=>`<div class="it"><span class="num">${fmt(x.d)} ${x.d.slice(0,4)}</span><span class="num"><b>${x.kg.toFixed(1)} kg</b>${x.waist?` · ${x.waist} cm`:''}</span><button class="btn sm ghost" data-delw="${x.d}">Delete</button></div>`).join('')}</div></div>`;
 }else out+=`<div class="empty">No weigh-ins yet. Add your first one above.</div>`;
 return out+'</div>';
}
function planAt(dstr,startKg){
 const j=parse('2027-01-01'),d=parse(dstr);if(d<=j)return startKg-0.1*((d-parse('2026-10-07'))/DAY/7);
 const atJ=startKg-0.1*((j-parse('2026-10-07'))/DAY/7);return Math.max(80,atJ-0.5*((d-j)/DAY/7));
}
function chart(W){
 const w=600,h=230,pl=36,pr=12,pt=12,pb=26;
 const x0=parse(W[0].d).getTime(),x1=Math.max(parse(W[W.length-1].d).getTime()+21*DAY,parse('2027-06-06').getTime());
 const startKg=W[0].kg;const planEnd=planAt(iso(new Date(x1)),startKg);
 const ys=W.map(x=>x.kg).concat([planEnd]);let lo=Math.floor(Math.min(...ys)-1),hi=Math.ceil(Math.max(...ys)+1);
 const X=t=>pl+(t-x0)/(x1-x0)*(w-pl-pr),Y=v=>pt+(hi-v)/(hi-lo)*(h-pt-pb);
 let s=`<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Weight over time">`;
 const step=Math.max(1,Math.ceil((hi-lo)/5));
 for(let v=lo;v<=hi;v+=step)s+=`<line class="grid" x1="${pl}" x2="${w-pr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;
 const m=new Date(x0);m.setDate(1);m.setMonth(m.getMonth()+1);
 for(;m.getTime()<=x1;m.setMonth(m.getMonth()+1))s+=`<text x="${X(m.getTime())}" y="${h-6}" text-anchor="middle">${m.toLocaleDateString('en-GB',{month:'short'})}</text>`;
 const pp=[];for(let t=x0;t<=x1;t+=7*DAY)pp.push(`${X(t).toFixed(1)},${Y(planAt(iso(new Date(t)),startKg)).toFixed(1)}`);
 s+=`<polyline class="plan" points="${pp.join(' ')}"/>`;
 s+=`<polyline class="line" points="${W.map(x=>`${X(parse(x.d).getTime()).toFixed(1)},${Y(x.kg).toFixed(1)}`).join(' ')}"/>`;
 W.forEach((x,i)=>{s+=`<circle class="${i===W.length-1?'last':'pt'}" cx="${X(parse(x.d).getTime())}" cy="${Y(x.kg)}" r="${i===W.length-1?5:3.5}"/>`});
 const L=W[W.length-1];s+=`<text x="${Math.min(X(parse(L.d).getTime())+8,w-40)}" y="${Y(L.kg)-8}" style="fill:var(--fg);font-weight:600">${L.kg.toFixed(1)}</text>`;
 return s+'</svg>';
}

  if(now.getTime()>=from&&now.getTime()<at.getTime()+90*60000&&ack!==true&&!(typeof ack==='number'&&ack>now.getTime()))due.push({s,k,at})}
 box.innerHTML=due.map(({s,k,at})=>`<div class="rem" role="alert"><div style="min-width:0"><b>${esc(s.title)}</b><div class="small">${s.time}${at>now?` · in ${Math.round((at-now)/60000)} min`:''}</div></div><div class="row" style="flex-wrap:nowrap"><button class="btn sm ghost" data-snooze="${k}">10 min</button><button class="btn sm" data-ack="${k}">Done</button></div></div>`).join('');

function saveSession(){
 const c=current();const W=c.ph.w[selW];const key=c.ph.id+'-'+W.name;const dr=D.draft[key]||{};

 W.items.forEach((it,i)=>{

  if(!reps.length&&!d.done&&!d.feel&&!d.note)return;
  const s=before[it.ex];
  const w=L==='kb'?+(d.w??s.w):(L==='db'||L==='bb'||L==='att')?+(d.w??(c.deload?parseFloat(weightLabel(it.ex,s,true)):s.w)):null;
  const lvl=L==='band'?+(d.lvl??s.lvl):null;
  items.push({ex:it.ex,w,lvl,reps,sets:it.kind==='emom'?1:setsFor(it,c),lo:it.lo,hi:it.hi,kind:it.kind,feel:d.feel||null,note:(d.note||'').trim(),done:!!d.done});
 });
 if(W.fin&&dr.fin&&(dr.fin.done||dr.fin.feel))items.push({ex:W.fin.ex,kind:'fin',done:!!dr.fin.done,feel:dr.fin.feel||null,reps:[],note:''});
 if(!items.length){toast('Log at least one exercise first');return}
 D.sessions.push({id:uid(),d:c.t,week:c.week,phase:c.ph.id,workout:W.name,deload:c.deload,items,note:(dr._s?.note||'').trim(),min:+(dr._s?.min||50)||50});
 const sum=[];W.items.forEach(it=>{const a=before[it.ex],b=suggest(it.ex);const L=EX[it.ex].load;if(L==='band'&&b.lvl!==a.lvl)sum.push(`${EX[it.ex].n}: ${BAND[a.lvl]} → ${BAND[b.lvl]}`);else if(L!=='band'&&L!=='bw'&&L!=='none'&&b.w!==a.w)sum.push(`${EX[it.ex].n}: ${a.w} → ${b.w} kg`);if(b.pain&&!a.pain)sum.push(`${EX[it.ex].n}: pain noted, held back`)});
 if(!sum.length)sum.push('Same weights. Beat your reps.');
 D.summary=sum;delete D.draft[key];selW=null;save();render();window.scrollTo(0,0);toast('Session saved');
}
